# Конфиг nginx для бенчмарка. 1 подставляется runner'ом.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 20000;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    gzip on;
    gzip_min_length 20;
    gzip_comp_level 6;
    gzip_types application/json text/plain;
    gzip_vary on;

    upstream backend {
        server 172.30.0.10:9090;
        keepalive 256;
    }

    server {
        listen 8080;

        location = /status { alias /www/status.json; }
        location = /big { alias /www/big.txt; }
        location /static/ { alias /www/; }
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /status { alias /www/status.json; }
        location = /big { alias /www/big.txt; }
        location /static/ { alias /www/; }
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
