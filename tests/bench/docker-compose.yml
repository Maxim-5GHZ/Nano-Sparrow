# Сравнительный бенчмарк: Nano-Sparrow (zero-alloc io_uring) vs Caddy vs Nginx.
#
# Управление: `make bench` (или вручную, см. README.md).
# Runner сам пересоздаёт сервисы с нужным числом воркеров (WORKERS=1/3),
# гоняет wrk, накладывает tc netem на свой eth0 (плохое соединение) и рисует графики.
name: bench

networks:
  bench:
    driver: bridge
    ipam:
      config:
        # Статический IPv4 бэкенда: sparrow резолвит upstream через inet_pton (без DNS)
        - subnet: 172.30.0.0/24

services:
  # ---------- Nano-Sparrow ----------
  sparrow:
    image: zero-alloc-server:bench
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: bench-sparrow
    ports:
      - "18080:8080"
    volumes:
      - ./configs/sparrow/server.conf:/app/server.conf:ro
      - ./www:/www:ro
    ulimits:
      memlock: { soft: -1, hard: -1 } # регистрация tx-буферов (SEND_ZC)
      nofile: { soft: 1048576, hard: 1048576 } # пул 512 splice-пайпов = 1024 fd
    cap_add:
      - SYS_RESOURCE # ядро иначе урезает пайпы до 8КБ (pipe-user-pages-soft)
    security_opt:
      - seccomp:unconfined # дефолтный профиль блокирует io_uring_*
    networks: [bench]
    restart: "no"

  sparrow-tls:
    image: zero-alloc-server:bench
    container_name: bench-sparrow-tls
    ports:
      - "18443:8443"
    volumes:
      - ./configs/sparrow/server-tls.conf:/app/server.conf:ro
      - ./www:/www:ro
      - ./certs:/certs:ro
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 1048576, hard: 1048576 } # пул 512 splice-пайпов = 1024 fd
    cap_add:
      - SYS_RESOURCE # ядро иначе урезает пайпы до 8КБ (pipe-user-pages-soft)
    security_opt:
      - seccomp:unconfined
    networks: [bench]
    restart: "no"

  # ---------- Caddy ----------
  caddy:
    image: caddy:2.9.1
    container_name: bench-caddy
    ports:
      - "18082:8080"
      - "18445:8443"
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/www:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    environment:
      GOMAXPROCS: "${WORKERS:-1}"
    networks: [bench]
    restart: "no"

  # ---------- Nginx ----------
  nginx:
    image: nginx:1.29-alpine
    container_name: bench-nginx
    ports:
      - "18083:8080"
      - "18446:8443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/www:ro
      - ./certs:/certs:ro
    networks: [bench]
    restart: "no"

  # ---------- Бэкенд для proxy-сценариев ----------
  backend:
    image: python:3.12-slim
    container_name: bench-backend
    command: ["python", "/srv/server.py"]
    volumes:
      - ./backend/server.py:/srv/server.py:ro
      - ./www:/www:ro
    networks:
      bench:
        ipv4_address: 172.30.0.10
    restart: "no"

  # ---------- Клиент нагрузки ----------
  # Нужен NET_ADMIN (tc netem) и docker.sock (пересоздание сервисов под WORKERS)
  runner:
    build:
      context: ./runner
    image: bench-runner:local
    container_name: bench-runner
    cap_add: [NET_ADMIN]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/bench
      - ./results:/results
      # отдельная папка для фазы «чистый sparrow» (run_only_sparrow.sh):
      # RESULTS_DIR=/results-sparrow, чтобы не затирать сравнительные results/
      - ./results-sparrow:/results-sparrow
    working_dir: /bench
    environment:
      WORKERS: "${WORKERS:-1}"
      RESULTS_DIR: /results
    command: ["sleep", "infinity"]
    networks: [bench]
    restart: "no"

volumes:
  caddy_data:
